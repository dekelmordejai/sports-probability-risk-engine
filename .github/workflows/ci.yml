name: Public research CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Mathematical, integration and temporal regressions
        run: python -m pytest -q
      - name: Offline multi-sport demonstration
        run: python run_daily_pipeline.py --demo --mode morning_scan
      - name: Chronological synthetic evaluation with baselines
        run: python -m examples.offline_evaluation --output reports/evaluation
